[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"
[build.environment]
  NODE_VERSION = "22"
[functions]
  node_bundler = "esbuild"
  included_files = ["private-site/**", "server/login.html", "server/login.js", "server/login.css"]
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/portal?resource=:splat"
  status = 200
  force = true
