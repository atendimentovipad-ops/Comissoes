<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acesso corporativo | Radar AD</title><link rel="stylesheet" href="/auth/login.css"></head><body><main class="card"><div class="brand">AD<span>•</span></div><p class="eyebrow">INTELIGÊNCIA COMERCIAL</p><h1>Acesso corporativo</h1><p class="intro">Consulte as condições bancárias com segurança. Entre com seu e-mail <strong>@adpromotora.com.br</strong>.</p><form id="email-form"><label for="email">E-mail corporativo</label><input id="email" type="email" autocomplete="email" placeholder="seu.nome@adpromotora.com.br" required maxlength="254"><button id="send" type="submit">Receber código</button></form><form id="code-form" hidden><p id="destination"></p><label for="code">Código de 6 números</label><input id="code" class="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required><button id="verify" type="submit">Validar e acessar</button><div class="actions"><button type="button" id="resend" class="text">Reenviar código</button><button type="button" id="change" class="text">Alterar e-mail</button></div></form><p id="message" role="status" aria-live="polite"></p><p class="foot">O código é de uso único. Não compartilhe com outras pessoas.</p></main><script src="/auth/login.js"></script></body></html>
